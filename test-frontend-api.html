<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frontend API Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test { margin: 10px 0; padding: 10px; border: 1px solid #ddd; border-radius: 5px; }
        .success { background-color: #d4edda; border-color: #c3e6cb; }
        .error { background-color: #f8d7da; border-color: #f5c6cb; }
        .loading { background-color: #fff3cd; border-color: #ffeaa7; }
        pre { background: #f8f9fa; padding: 10px; border-radius: 3px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>🧪 Frontend API Integration Test</h1>
    <p>Testing if frontend can communicate with API at <code>http://localhost:3001</code></p>
    
    <div id="test-results"></div>
    
    <script>
        const API_BASE_URL = 'http://localhost:3001';
        const resultsDiv = document.getElementById('test-results');
        
        function addResult(title, status, message, data = null) {
            const div = document.createElement('div');
            div.className = `test ${status}`;
            div.innerHTML = `
                <h3>${title}</h3>
                <p>${message}</p>
                ${data ? `<pre>${JSON.stringify(data, null, 2)}</pre>` : ''}
            `;
            resultsDiv.appendChild(div);
        }
        
        async function runTests() {
            addResult('Starting Tests', 'loading', 'Running API integration tests...');
            
            try {
                // Test 1: Categories (Public)
                addResult('Test 1: Categories', 'loading', 'Fetching categories...');
                const categoriesResponse = await fetch(`${API_BASE_URL}/categories`);
                const categories = await categoriesResponse.json();
                
                if (categoriesResponse.ok && Array.isArray(categories)) {
                    addResult('Test 1: Categories', 'success', `✅ Successfully fetched ${categories.length} categories`, categories.slice(0, 3));
                } else {
                    addResult('Test 1: Categories', 'error', '❌ Failed to fetch categories', categories);
                }
                
                // Test 2: Login
                addResult('Test 2: Authentication', 'loading', 'Testing login...');
                const loginResponse = await fetch(`${API_BASE_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: 'test@example.com',
                        password: 'password123'
                    })
                });
                const loginData = await loginResponse.json();
                
                if (loginResponse.ok && loginData.token) {
                    addResult('Test 2: Authentication', 'success', '✅ Login successful', {
                        user: loginData.user.email,
                        token: loginData.token.substring(0, 20) + '...'
                    });
                    
                    // Test 3: Protected Route (Wallet)
                    addResult('Test 3: Protected Route', 'loading', 'Testing wallet endpoint...');
                    const walletResponse = await fetch(`${API_BASE_URL}/wallet`, {
                        headers: { 'Authorization': `Bearer ${loginData.token}` }
                    });
                    const walletData = await walletResponse.json();
                    
                    if (walletResponse.ok) {
                        addResult('Test 3: Protected Route', 'success', '✅ Wallet data retrieved', walletData);
                    } else {
                        addResult('Test 3: Protected Route', 'error', '❌ Failed to fetch wallet', walletData);
                    }
                    
                } else {
                    addResult('Test 2: Authentication', 'error', '❌ Login failed', loginData);
                }
                
                addResult('Tests Complete', 'success', '🎉 All tests completed!');
                
            } catch (error) {
                addResult('Test Error', 'error', `❌ Network error: ${error.message}`);
            }
        }
        
        // Run tests when page loads
        runTests();
    </script>
</body>
</html>
